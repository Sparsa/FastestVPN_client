name: AppImage

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  # Creating/publishing a release in the GitHub UI attaches the AppImage to it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the AppImage to (empty = build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Oldest supported runner: the AppImage only runs on glibc >= the build host's (2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly the tagged commit when attaching to an existing release.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev file desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            version="${{ inputs.release_tag }}"
            version="${version#v}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 \
              | jq -r '.packages[] | select(.name == "fastestvpn-gui") | .version')-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package AppImage
        env:
          # The runner has no FUSE; let linuxdeploy run from an extracted copy.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_OUTPUT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          desktop-file-validate fastestvpn-gui.desktop

          mkdir -p tools dist
          wget -q -O tools/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x tools/linuxdeploy

          out="fastestvpn-gui-${{ steps.version.outputs.version }}-x86_64.AppImage"
          # Pass 1: populate the AppDir (binary, desktop entry, icon theme).
          tools/linuxdeploy \
            --appdir AppDir \
            --executable target/release/fastestvpn-gui \
            --desktop-file fastestvpn-gui.desktop \
            --icon-file assets/icons/256x256/fastestvpn-gui.png \
            --icon-file assets/icons/512x512/fastestvpn-gui.png \
            --icon-file assets/icons/128x128/fastestvpn-gui.png \
            --icon-file assets/icons/64x64/fastestvpn-gui.png \
            --icon-file assets/icons/48x48/fastestvpn-gui.png \
            --icon-file assets/icons/32x32/fastestvpn-gui.png \
            --icon-file assets/fastestvpn-gui.svg

          # linuxdeploy picks the SVG for .DirIcon, but AppImage tooling and file-manager
          # thumbnailers expect a PNG there.
          rm -f AppDir/.DirIcon
          cp assets/icons/256x256/fastestvpn-gui.png AppDir/.DirIcon
          file AppDir/.DirIcon | grep -q PNG
          find AppDir/usr/share/icons -type f | sort

          # Pass 2: package the prepared AppDir.
          LDAI_OUTPUT="dist/$out" tools/linuxdeploy --appdir AppDir --output appimage

          cd dist
          sha256sum "$out" > "$out.sha256"
          echo "APPIMAGE=dist/$out" >> "$GITHUB_ENV"

      - name: Smoke-test AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          ./"$APPIMAGE" --help
          ./"$APPIMAGE" --doctor

      - uses: actions/upload-artifact@v4
        with:
          name: fastestvpn-gui-appimage
          path: |
            ${{ env.APPIMAGE }}
            ${{ env.APPIMAGE }}.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || github.ref_type == 'tag' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fastestvpn-gui-appimage

      - uses: softprops/action-gh-release@v2
        with:
          # Empty for tag pushes / release events, where the ref already names the tag.
          tag_name: ${{ inputs.release_tag }}
          files: |
            *.AppImage
            *.AppImage.sha256
          generate_release_notes: true
